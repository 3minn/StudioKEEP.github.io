# 빌드 시 배포 변수로 치환합니다. OAuth Secret은 이 파일에 넣지 않습니다.
backend:
  name: github
  repo: __REPOSITORY__
  branch: main
  base_url: __AUTH_URL__
  auth_endpoint: auth
locale: ko
site_url: __SITE_URL__/
display_url: __SITE_URL__/
logo_url: __SITE_URL__/assets/kipfel-cursor.png
media_folder: content/uploads
public_folder: uploads
publish_mode: simple
show_preview_links: false
slug:
  encoding: ascii
  clean_accents: true
collections:
  - name: members
    label: 멤버
    label_singular: 멤버
    folder: content/members
    summary: "{{name}} · 공개: {{published}}"
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: id
    slug: '{{slug}}'
    preview_path: '#member/{{id}}'
    editor: {preview: false}
    fields:
      - {label: "고유 ID (생성 후 변경 금지)", name: id, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '영문 소문자·숫자·하이픈만 사용하세요.'], hint: "예: kipfel-mv. 기존 항목의 ID는 바꾸지 마세요."}
      - {label: "사이트에 공개", name: published, widget: boolean, default: false, hint: "끄고 저장하면 다음 배포에서 제외됩니다. 공개 GitHub 저장소의 원본과 이력은 숨겨지지 않습니다."}
      - {label: "표시 순서 (작은 숫자가 먼저)", name: order, widget: number, value_type: int, min: 0, default: 0}
      - {label: "이름 (한국어)", name: name, widget: string, required: true}
      - {label: "이름 (영어 · 선택)", name: name_en, widget: string, required: false}
      - {label: "이름 (일본어 · 선택)", name: name_ja, widget: string, required: false}
      - {label: "소개 (한국어)", name: desc, widget: text, required: false}
      - {label: "소개 (영어 · 선택)", name: desc_en, widget: text, required: false}
      - {label: "소개 (일본어 · 선택)", name: desc_ja, widget: text, required: false}
      - label: "프로필 이미지 (선택)"
        name: image
        widget: image
        required: false
        allow_multiple: false
        choose_url: false
        media_library:
          config: {max_file_size: 10485760}
        hint: "PNG, JPG, WEBP, GIF. 영문 파일명 권장. 삭제할 때 다른 콘텐츠에서 사용 중인지 먼저 확인하세요."
      - {label: "활동 분야", name: role, widget: select, options: [본부장, 연출, 편집, 3D, 연기, 운영, 인사, 회계, 홍보]}
      - label: "대표 참여작 (선택)"
        name: featured_projects
        widget: relation
        collection: projects
        search_fields: [title, id]
        value_field: id
        display_fields: [title]
        multiple: true
        required: false
        hint: "프로젝트 크레딧에 본인이 등록된 공개 작품만 노출됩니다. 나머지 참여작은 자동 연결됩니다."
  - name: projects
    label: 프로젝트
    label_singular: 프로젝트
    folder: content/projects
    summary: "{{title}} · 공개: {{published}}"
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: id
    slug: '{{slug}}'
    preview_path: '#work/{{id}}'
    editor: {preview: false}
    fields:
      - {label: "고유 ID (생성 후 변경 금지)", name: id, widget: string, pattern: ['^([a-z0-9]+(-[a-z0-9]+)*|yt-[A-Za-z0-9_-]{11})$', '일반 ID는 소문자·숫자·하이픈, YouTube ID는 yt- 뒤에 영상 ID 11자리를 사용하세요.'], hint: "예: kipfel-mv 또는 yt-Qlgpr67J9ig. 기존 항목의 ID는 바꾸지 마세요."}
      - {label: "사이트에 공개", name: published, widget: boolean, default: false, hint: "끄고 저장하면 다음 배포에서 제외됩니다. 공개 GitHub 저장소의 원본과 이력은 숨겨지지 않습니다."}
      - {label: "표시 순서 (작은 숫자가 먼저)", name: order, widget: number, value_type: int, min: 0, default: 0}
      - {label: "제목 (한국어)", name: title, widget: string, required: true}
      - {label: "제목 (영어 · 선택)", name: title_en, widget: string, required: false}
      - {label: "제목 (일본어 · 선택)", name: title_ja, widget: string, required: false}
      - {label: "소개 (한국어)", name: desc, widget: text, required: false}
      - {label: "소개 (영어 · 선택)", name: desc_en, widget: text, required: false}
      - {label: "소개 (일본어 · 선택)", name: desc_ja, widget: text, required: false}
      - label: "대표 이미지 (선택)"
        name: image
        widget: image
        required: false
        allow_multiple: false
        choose_url: false
        media_library:
          config: {max_file_size: 10485760}
        hint: "PNG, JPG, WEBP, GIF. 영문 파일명 권장. 삭제할 때 다른 콘텐츠에서 사용 중인지 먼저 확인하세요."
      - {label: "작품 분류", name: group, widget: select, options: [FILM, WORLD / GAME, EXPERIENCE, 3D / DESIGN]}
      - {label: "분류 보조 문구 (선택)", name: category, widget: string, required: false}
      - {label: "진행 상태 (한국어)", name: status, widget: string, required: false}
      - {label: "진행 상태 (영어 · 선택)", name: status_en, widget: string, required: false}
      - {label: "진행 상태 (일본어 · 선택)", name: status_ja, widget: string, required: false}
      - {label: "작품 감상 링크 (HTTPS · 선택)", name: url, widget: string, required: false, pattern: ['^https://[^\s]+$', 'https://로 시작하는 주소를 입력하세요.']}
      - {label: "이미지 미등록 시 그래픽", name: art, widget: select, options: [{label: "타이포그래피", value: film}, {label: "원형", value: moon}, {label: "포털", value: portal}], default: film}
      - label: "제작 크레딧 · 참여 멤버"
        name: credits
        widget: relation
        collection: members
        search_fields: [name, id]
        value_field: id
        display_fields: [name, role]
        multiple: true
        required: false
        hint: "비공개 또는 삭제된 멤버는 사이트 크레딧에서 제외됩니다."
, '일반 ID는 영문 소문자·숫자·하이픈, YouTube ID는 yt- 뒤에 영상 ID 11자리를 사용하세요.'], hint: "예: kipfel-mv. 기존 항목의 ID는 바꾸지 마세요."}
      - {label: "사이트에 공개", name: published, widget: boolean, default: false, hint: "끄고 저장하면 다음 배포에서 제외됩니다. 공개 GitHub 저장소의 원본과 이력은 숨겨지지 않습니다."}
      - {label: "표시 순서 (작은 숫자가 먼저)", name: order, widget: number, value_type: int, min: 0, default: 0}
      - {label: "제목 (한국어)", name: title, widget: string, required: true}
      - {label: "제목 (영어 · 선택)", name: title_en, widget: string, required: false}
      - {label: "제목 (일본어 · 선택)", name: title_ja, widget: string, required: false}
      - {label: "소개 (한국어)", name: desc, widget: text, required: false}
      - {label: "소개 (영어 · 선택)", name: desc_en, widget: text, required: false}
      - {label: "소개 (일본어 · 선택)", name: desc_ja, widget: text, required: false}
      - label: "대표 이미지 (선택)"
        name: image
        widget: image
        required: false
        allow_multiple: false
        choose_url: false
        media_library:
          config: {max_file_size: 10485760}
        hint: "PNG, JPG, WEBP, GIF. 영문 파일명 권장. 삭제할 때 다른 콘텐츠에서 사용 중인지 먼저 확인하세요."
      - {label: "작품 분류", name: group, widget: select, options: [FILM, WORLD / GAME, EXPERIENCE, 3D / DESIGN]}
      - {label: "분류 보조 문구 (선택)", name: category, widget: string, required: false}
      - {label: "진행 상태 (한국어)", name: status, widget: string, required: false}
      - {label: "진행 상태 (영어 · 선택)", name: status_en, widget: string, required: false}
      - {label: "진행 상태 (일본어 · 선택)", name: status_ja, widget: string, required: false}
      - {label: "작품 감상 링크 (HTTPS · 선택)", name: url, widget: string, required: false, pattern: ['^https://[^\s]+$', 'https://로 시작하는 주소를 입력하세요.']}
      - {label: "이미지 미등록 시 그래픽", name: art, widget: select, options: [{label: "타이포그래피", value: film}, {label: "원형", value: moon}, {label: "포털", value: portal}], default: film}
      - label: "제작 크레딧 · 참여 멤버"
        name: credits
        widget: relation
        collection: members
        search_fields: [name, id]
        value_field: id
        display_fields: [name, role]
        multiple: true
        required: false
        hint: "비공개 또는 삭제된 멤버는 사이트 크레딧에서 제외됩니다."
  - name: announcements
    label: 공지사항
    label_singular: 공지사항
    folder: content/announcements
    summary: "{{title}} · 공개: {{published}}"
    create: true
    delete: true
    format: json
    extension: json
    identifier_field: id
    slug: '{{slug}}'
    preview_path: '#announcements'
    editor: {preview: false}
    fields:
      - {label: "고유 ID (생성 후 변경 금지)", name: id, widget: string, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', '영문 소문자·숫자·하이픈만 사용하세요.'], hint: "예: kipfel-mv. 기존 항목의 ID는 바꾸지 마세요."}
      - {label: "사이트에 공개", name: published, widget: boolean, default: false, hint: "끄고 저장하면 다음 배포에서 제외됩니다. 공개 GitHub 저장소의 원본과 이력은 숨겨지지 않습니다."}
      - {label: "표시 순서 (작은 숫자가 먼저)", name: order, widget: number, value_type: int, min: 0, default: 0}
      - {label: "제목 (한국어)", name: title, widget: string, required: true}
      - {label: "제목 (영어 · 선택)", name: title_en, widget: string, required: false}
      - {label: "제목 (일본어 · 선택)", name: title_ja, widget: string, required: false}
      - label: "대표 이미지 (선택)"
        name: image
        widget: image
        required: false
        allow_multiple: false
        choose_url: false
        media_library:
          config: {max_file_size: 10485760}
        hint: "PNG, JPG, WEBP, GIF. 영문 파일명 권장. 삭제할 때 다른 콘텐츠에서 사용 중인지 먼저 확인하세요."
      - {label: "게시일", name: date, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, picker_utc: true}
      - {label: "내용 (줄바꿈 지원 · HTML 불가) (한국어)", name: body, widget: text, required: true}
      - {label: "내용 (줄바꿈 지원 · HTML 불가) (영어 · 선택)", name: body_en, widget: text, required: false}
      - {label: "내용 (줄바꿈 지원 · HTML 불가) (일본어 · 선택)", name: body_ja, widget: text, required: false}

  - name: site_settings
    label: 홈페이지 전체 설정
    editor: {preview: false}
    files:
      - name: homepage
        label: 영상 · 문구 · 버튼 · 링크
        file: content/settings/site.json
        format: json
        fields:
          - {label: "사이트 제목", name: site_title, widget: string}
          - {label: "검색 결과 설명", name: site_description, widget: text}
          - {label: "입장 화면 작은 제목", name: hero_kicker, widget: string}
          - {label: "입장 화면 큰 제목", name: hero_title, widget: string}
          - {label: "입장 화면 하단 문구", name: hero_caption, widget: text}
          - {label: "스크롤 버튼 문구", name: scroll_label, widget: string}
          - label: "인트로 영상 (최대 4개)"
            name: reels
            widget: list
            min: 1
            max: 4
            summary: "{{fields.label}}"
            fields:
              - {label: "영상 선택 버튼 이름", name: label, widget: string}
              - {label: "영상 파일 업로드 (MP4/WebM)", name: src, widget: file, required: false, hint: "25MB 이하의 짧은 영상만 권장. 외부 영상 URL은 저장된 JSON에서 직접 입력할 수 있습니다."}
              - {label: "포스터 이미지 (선택)", name: poster, widget: image, required: false}
          - {label: "문의 버튼 링크 (HTTPS)", name: contact_url, widget: string, required: false}
          - {label: "지원 버튼 링크 (HTTPS)", name: join_url, widget: string, required: false}
          - label: "부서별 지원서 · 모집 관리"
            name: recruitment
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - {label: "부서 이름", name: name, widget: string}
              - {label: "부서 이름 (영어)", name: name_en, widget: string, required: false}
              - {label: "부서 이름 (일본어)", name: name_ja, widget: string, required: false}
              - {label: "부서 소개", name: description, widget: text, required: false}
              - {label: "부서 소개 (영어)", name: description_en, widget: text, required: false}
              - {label: "부서 소개 (일본어)", name: description_ja, widget: text, required: false}
              - {label: "Google Forms 지원서 주소", name: url, widget: string, required: false, hint: "docs.google.com/forms/d/e/.../viewform 주소"}
              - {label: "모집 중", name: open, widget: boolean, default: true}
          - {label: "푸터 문구", name: footer_note, widget: text}
          - {label: "푸터 마지막 문구", name: footer_tagline, widget: string}
          - label: "화면 문구 자유 변경"
            name: text_overrides
            widget: list
            required: false
            summary: "{{fields.original}}"
            hint: "기존 홈페이지에서 보이는 문구를 '원래 문구'에 정확히 입력하면 교체합니다. 언어별 값을 따로 지정할 수 있습니다."
            fields:
              - {label: "원래 문구 (홈페이지에 보이는 글자 그대로)", name: original, widget: string}
              - {label: "변경할 한국어", name: ko, widget: text}
              - {label: "변경할 영어 (선택)", name: en, widget: text, required: false}
              - {label: "변경할 일본어 (선택)", name: ja, widget: text, required: false}

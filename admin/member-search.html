<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>멤버 검색 · Studio KEEP CMS</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:light}body{max-width:960px;margin:35px auto;padding:0 20px;color:#20242a}a{color:#147d69}h1{font-size:27px}input{box-sizing:border-box;width:100%;padding:15px;border:1px solid #a9b1b5;border-radius:8px;font-size:17px}#count{color:#667;margin:18px 0}.item{border-bottom:1px solid #e4e6e7;padding:16px 0;display:flex;justify-content:space-between;gap:15px;align-items:center}.item small{color:#666;display:block;margin-top:5px}.item a{white-space:nowrap}.hint{color:#667;font-size:14px}</style></head><body>
<a href="./">← CMS 관리자로 돌아가기</a><h1>멤버 검색</h1><p class="hint">GitHub의 최신 멤버 원본 파일을 검색합니다. 비공개 멤버도 포함되며, 검색 결과를 누르면 CMS 편집 화면으로 이동합니다.</p><label for="search">이름 · 부서 · ID로 검색</label><input id="search" type="search" placeholder="멤버 이름 또는 부서 입력" autofocus><div id="count" aria-live="polite">목록 불러오는 중…</div><div id="list"></div>
<script>
const repo='3minn/StudioKEEP.github.io',api='https://api.github.com/repos/'+repo+'/contents/content/members',input=document.getElementById('search'),list=document.getElementById('list'),count=document.getElementById('count');let members=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function render(){const q=input.value.trim().toLocaleLowerCase();const found=members.filter(m=>[m.name,m.role,m.id,m.desc].some(v=>String(v||'').toLocaleLowerCase().includes(q)));count.textContent=found.length+'명 / 전체 '+members.length+'명';list.innerHTML=found.map(m=>'<div class="item"><div><strong>'+esc(m.name)+'</strong><small>'+esc(m.role)+' · '+esc(m.published?'공개':'비공개')+' · '+esc(m.id)+'</small></div><a href="./#/collections/members/entries/'+encodeURIComponent(m.id)+'">CMS에서 편집 ↗</a></div>').join('')||'<p>검색 결과가 없습니다.</p>';}
input.addEventListener('input',render);
(async()=>{try{const response=await fetch(api,{headers:{Accept:'application/vnd.github+json'},cache:'no-store'});if(!response.ok)throw Error('GitHub API '+response.status);const files=(await response.json()).filter(f=>f.type==='file'&&f.name.endsWith('.json'));const results=await Promise.all(files.map(async f=>{const res=await fetch(f.download_url,{cache:'no-store'});if(!res.ok)return null;return res.json()}));members=results.filter(Boolean).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko'));render()}catch(e){count.textContent='목록을 불러오지 못했습니다: '+e.message;list.innerHTML='<p>잠시 후 새로고침하거나 CMS 기본 멤버 목록을 이용해 주세요.</p>'}})();
</script></body></html>

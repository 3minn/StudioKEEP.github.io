/* Keep navigation readable while providing a translucent hover treatment. */
header nav a{border-radius:7px;padding:9px 12px;margin:-1px -12px;transition:background-color .22s ease,opacity .22s ease,backdrop-filter .22s ease}
header nav a:hover,header nav a:focus-visible{background:transparent;backdrop-filter:none;opacity:.55;border-bottom-color:transparent}
/* Underline-only active navigation; hover fades the lettering without a pill or border. */
header nav a{border-bottom:0!important;position:relative;border-radius:0;background:transparent!important;backdrop-filter:none!important}
header nav a::after{content:"";position:absolute;left:12px;right:12px;bottom:2px;height:1px;background:currentColor;opacity:0;transform:scaleX(.65);transition:opacity .22s ease,transform .22s ease;pointer-events:none}
header nav a[aria-current="page"]::after{opacity:.85;transform:scaleX(1)}
header nav a:hover,header nav a:focus-visible{opacity:.55}
header nav a[aria-current="page"]:hover::after,header nav a[aria-current="page"]:focus-visible::after{opacity:.5}
/* Softer, subtler hologram during page changes. */
.sweep{background:linear-gradient(112deg,transparent 33%,rgba(202,246,255,.13) 43%,rgba(227,203,255,.18) 49%,rgba(255,228,242,.14) 54%,rgba(222,250,230,.10) 61%,transparent 70%);filter:blur(38px)}
.sweep.run{animation:soft-sweep .7s ease-in-out}
@keyframes soft-sweep{0%{opacity:0;transform:translateX(-100%) skewX(-15deg)}40%{opacity:.38}100%{opacity:0;transform:translateX(100%) skewX(-15deg)}}
@media(prefers-reduced-motion:reduce){.sweep.run{animation:none}}
/* Sequential pen-drawn lettering: each glyph is traced, then filled in place. */
.hero-type h1{display:flex;justify-content:center;align-items:baseline;white-space:nowrap;overflow:visible}
.hero-type .hero-letter{position:relative;display:inline-block;color:transparent;animation:hero-ink-fill .38s ease-out calc(var(--letter-delay) + .53s) both}
.hero-type .hero-letter::before{content:attr(data-letter);position:absolute;inset:0;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.92);paint-order:stroke fill;clip-path:inset(0 100% 0 0);animation:hero-trace .58s cubic-bezier(.32,.08,.2,1) var(--letter-delay) both}
.hero-type .hero-letter-space{width:.27em;flex-shrink:0}
@keyframes hero-trace{0%{clip-path:inset(0 100% 0 0);opacity:.2}75%{opacity:1}100%{clip-path:inset(0 0 0 0);opacity:1}}
